      <text x="819" y="302" font-weight="700" font-size="12">Live-Workshop</text><text x="819" y="320">13:00 Uhr</text><text x="819" y="336" font-size="12">90 Min.</text>
      <text x="925" y="302" font-weight="700" font-size="12">Live-Workshop</text><text x="925" y="320">13:00 Uhr</text><text x="925" y="336" font-size="12">90 Min.</text>
    </g>
