    <rect x="455" y="373" width="92" height="66" rx="2" fill="#FFFFFF" stroke="#FFB000" stroke-width="3"/>
    <rect x="667" y="373" width="92" height="66" rx="2" fill="#FFFFFF" stroke="#FFB000" stroke-width="3"/>
    <g fill="#00505A" text-anchor="middle" font-size="13">
