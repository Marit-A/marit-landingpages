<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" font-family="'Open Sans','PT Sans',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ablauf der Powerwoche vom 4. bis 11. Dezember 2026</title>
  <desc id="d">Freitag 4.12. um 13 Uhr Auftakt-Workshop. Montag 7., Dienstag 8. und Mittwoch 9.12. um 9:30 Uhr Live-Workshop. Donnerstag 10. und Freitag 11.12. um 13 Uhr Live-Workshop. Montag 7. und Mittwoch 9.12. um 17 Uhr Sprechstunde.</desc>

  <rect width="1000" height="500" fill="#FFFFFF"/>

  <!-- Titel -->
  <text x="24" y="44" font-family="'PT Sans','Open Sans',Arial,sans-serif" font-weight="700" font-size="28" fill="#00505A">Powerwoche: 4. bis 11. Dezember 2026</text>
  <text x="24" y="70" font-size="14" fill="#4A5A5C">Live-Online per Zoom, alle Zeiten Berliner Zeit, mit Aufzeichnung</text>
  <rect x="24" y="80" width="64" height="4" fill="#FFB000"/>

  <!-- Wochenend-Spalten -->
  <rect x="236" y="100" width="212" height="352" fill="#F1F4F4"/>

  <!-- Spaltenköpfe -->
  <g font-family="'PT Sans','Open Sans',Arial,sans-serif" text-anchor="middle" fill="#00505A">
    <text x="183" y="124" font-weight="700" font-size="16">Fr</text><text x="183" y="144" font-size="14">4.12.</text>
    <text x="289" y="124" font-weight="700" font-size="16">Sa</text><text x="289" y="144" font-size="14">5.12.</text>
    <text x="395" y="124" font-weight="700" font-size="16">So</text><text x="395" y="144" font-size="14">6.12.</text>
    <text x="501" y="124" font-weight="700" font-size="16">Mo</text><text x="501" y="144" font-size="14">7.12.</text>
    <text x="607" y="124" font-weight="700" font-size="16">Di</text><text x="607" y="144" font-size="14">8.12.</text>
    <text x="713" y="124" font-weight="700" font-size="16">Mi</text><text x="713" y="144" font-size="14">9.12.</text>
    <text x="819" y="124" font-weight="700" font-size="16">Do</text><text x="819" y="144" font-size="14">10.12.</text>
    <text x="925" y="124" font-weight="700" font-size="16">Fr</text><text x="925" y="144" font-size="14">11.12.</text>
  </g>
  <line x1="24" y1="156" x2="978" y2="156" stroke="#00B3C3" stroke-width="2"/>

