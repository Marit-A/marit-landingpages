  <g>
    <rect x="454" y="176" width="94" height="68" rx="2" fill="#00808E"/>
    <rect x="560" y="176" width="94" height="68" rx="2" fill="#00808E"/>
    <rect x="666" y="176" width="94" height="68" rx="2" fill="#00808E"/>
    <g fill="#FFFFFF" text-anchor="middle" font-size="13">
      <text x="501" y="204" font-weight="700" font-size="12">Live-Workshop</text><text x="501" y="222">9:30 Uhr</text><text x="501" y="238" font-size="12">90 Min.</text>
      <text x="607" y="204" font-weight="700" font-size="12">Live-Workshop</text><text x="607" y="222">9:30 Uhr</text><text x="607" y="238" font-size="12">90 Min.</text>
      <text x="713" y="204" font-weight="700" font-size="12">Live-Workshop</text><text x="713" y="222">9:30 Uhr</text><text x="713" y="238" font-size="12">90 Min.</text>
    </g>
  </g>

  <!-- Mittag 13:00: Fr 4. Auftakt, Do 10., Fr 11. -->
  <g>
    <rect x="136" y="274" width="94" height="68" rx="2" fill="#00505A"/>
    <rect x="772" y="274" width="94" height="68" rx="2" fill="#00808E"/>
    <rect x="878" y="274" width="94" height="68" rx="2" fill="#00808E"/>
    <g fill="#FFFFFF" text-anchor="middle" font-size="13">
