    <text x="50" y="482">Live-Workshop: Einsteiger-Teil, Pause, Teil für Fortgeschrittene</text>
    <rect x="474" y="470" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#FFB000" stroke-width="2.5"/>
    <text x="500" y="482">Abendliche Sprechstunde</text>
